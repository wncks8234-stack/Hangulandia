# Manual: build the production channel (no test hooks, no remote reset), run all gates, keep the bundle as an artifact
# for the Android wrapper / production hosting. Does not touch the test site.
name: release-prod
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - run: HL_FORCE_AUTH=1 python3 tools/build.py --channel prod && node tools/qa/sync-e2e.js
      - run: python3 tools/build.py --channel prod
      - run: python3 tools/check.py --channel prod
      - run: node tools/qa/smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: hangulandia-prod
          path: .build/out
          retention-days: 90
