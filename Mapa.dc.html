dbe"}, {"w": "모든 색깔", "me": "todos los colores", "r": "modun sekkal", "img": "_blob/b3a63c2be40d6092ad89f1d0acc71109"}]}, {"t": "한 낱말이 된 말 (붙여 써요)", "e": "ya son una palabra (junto)", "items": [{"w": "첫사랑", "me": "primer amor", "r": "chossarang", "img": "_blob/1ced231a65610ccccb3443cc579c0519"}, {"w": "옛사랑", "me": "viejo amor", "r": "yessarang", "img": "_blob/7ce70e67cb5c2599c766573a18e6f144"}]}]}}, {"img": [], "ko": "수를 나타내는 관형사를 쓰려면 고유어 숫자를 알아야 해요. 먼저 1부터 10까지 세어 봐요.", "es": "Para los determinantes numerales hay que saber los números nativos. Cuenta del 1 al 10.", "t": "", "q": false, "v": {"k": "grid", "cols": 5, "items": [{"c": "1", "n": "하나", "r": "jana"}, {"c": "2", "n": "둘", "r": "dul"}, {"c": "3", "n": "셋", "r": "set"}, {"c": "4", "n": "넷", "r": "net"}, {"c": "5", "n": "다섯", "r": "dasot"}, {"c": "6", "n": "여섯", "r": "yosot"}, {"c": "7", "n": "일곱", "r": "ilgop"}, {"c": "8", "n": "여덟", "r": "yodol"}, {"c": "9", "n": "아홉", "r": "ajop"}, {"c": "10", "n": "열", "r": "yol"}]}}, {"img": [], "ko": "11부터 19까지는 열 뒤에 하나, 둘, 셋…을 붙여요. 20은 스물이에요.", "es": "Del 11 al 19 se pone 열 + 하나, 둘, 셋… El 20 es 스물.", "t": "", "q": false, "v": {"k": "grid", "cols": 5, "items": [{"c": "11", "n": "열하나", "r": "yorana"}, {"c": "12", "n": "열둘", "r": "yoldul"}, {"c": "13", "n": "열셋", "r": "yolset"}, {"c": "14", "n": "열넷", "r": "yollet"}, {"c": "15", "n": "열다섯", "r": "yoldasot"}, {"c": "16", "n": "열여섯", "r": "yollyosot"}, {"c": "17", "n": "열일곱", "r": "yollilgop"}, {"c": "18", "n": "열여덟", "r": "yollyodol"}, {"c": "19", "n": "열아홉", "r": "yorajop"}, {"c": "20", "n": "스물", "r": "sumul"}]}}, {"img": [], "ko": "10, 20, 30…은 이렇게 말해요. 100은 보통 한자어로 \"백\"이라고 해요. \"온\"은 옛날 말이에요.", "es": "Así se dicen 10, 20, 30… Para 100 normalmente se usa 백 (sinocoreano); 온 es una forma antigua.", "t": "", "q": false, "v": {"k": "grid", "cols": 5, "items": [{"c": "10", "n": "열", "r": "yol"}, {"c": "20", "n": "스물", "r": "sumul"}, {"c": "30", "n": "서른", "r": "sorun"}, {"c": "40", "n": "마흔", "r": "majun"}, {"c": "50", "n": "쉰", "r": "swin"}, {"c": "60", "n": "예순", "r": "yesun"}, {"c": "70", "n": "일흔", "r": "iljun"}, {"c": "80", "n": "여든", "r": "yodun"}, {"c": "90", "n": "아흔", "r": "ajun"}, {"c": "100", "n": "온", "r": "on"}]}}, {"img": [], "ko": "숫자는 혼자 쓰면 수사, 명사 앞에서 꾸미면 수관형사예요. 명사 앞에서는 모양이 바뀌는 숫자가 있어요.", "es": "Solo, el número es un numeral; delante de un sustantivo es un determinante numeral. Algunos cambian de forma delante del sustantivo.", "t": "", "q": false, "v": {"k": "pos", "groups": [{"t": "수사 (조사를 붙여요)", "e": "numeral (lleva partícula)", "items": [{"w": "하나", "me": "uno", "r": "jana"}, {"w": "둘", "me": "dos", "r": "dul"}, {"w": "셋", "me": "tres", "r": "set"}, {"w": "첫째", "me": "primero", "r": "chocche"}], "d": "사과 둘을 샀어요. 첫째가 학교에 가요.", "de": "Compré dos manzanas (둘을). El mayor va a la escuela."}, {"t": "수관형사 (명사 앞)", "e": "determinante numeral (delante del sustantivo)", "items": [{"w": "한 개", "me": "una cosa", "r": "jan gue"}, {"w": "두 명", "me": "dos personas", "r": "du myong"}, {"w": "세 권", "me": "tres libros", "r": "se gwon"}, {"w": "스무 살", "me": "veinte años", "r": "sumu sal"}]}, {"t": "모양이 바뀌어요", "e": "cambian de forma", "pts": [{"ko": "하나 → 한, 둘 → 두, 셋 → 세, 넷 → 네", "es": "하나, 둘, 셋, 넷 pasan a 한, 두, 세, 네."}, {"ko": "스물 → 스무 (스무 살)", "es": "스물 pasa a 스무 (스무 살)."}]}]}}, {"img": [], "ko": "같은 숫자도 문장에서 하는 일이 달라요. 뒤에 조사가 오면 수사, 명사가 오면 수관형사예요.", "es": "El mismo número cambia de función: si le sigue una partícula es numeral; si le sigue un sustantivo, determinante.", "t": "", "q": false, "v": {"k": "pat", "t": "수사 · 수관형사", "e": "Numeral · determinante", "items": [{"ko": "셋이서 영화를 봤어요.", "r": "sesiso yongjwarul bwassoyo", "es": "Los tres vimos una película. · 셋 + 이서 → numeral"}, {"ko": "세 사람이 영화를 봤어요.", "r": "se sarami yongjwarul bwassoyo", "es": "Tres personas vieron una película. · 세 + 사람 → determinante"}, {"ko": "그는 첫째를 아주 아껴요.", "r": "gunun choccherul achu akkyoyo", "es": "Él quiere mucho al mayor. · 첫째 + 를 → numeral"}, {"ko": "첫째 아이가 학교에 가요.", "r": "chocche aiga jakkyoe gayo
