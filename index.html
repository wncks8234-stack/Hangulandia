<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="darkreader-lock"><style>:root{color-scheme:only light!important}</style><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>한글 나라 · Hangulandia</title>
<meta name="theme-color" content="#FFF1C4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="한글 나라"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0;height:100%;background:#FFF1C4;font-family:system-ui,sans-serif;color:#4A3A32}.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;box-sizing:border-box}img{width:140px;animation:b 1.2s ease-in-out infinite}@keyframes b{50%{transform:translateY(-10px)}}.bar{width:220px;height:10px;border-radius:10px;background:#fff;border:1.5px solid #8A766B;overflow:hidden}.bar i{display:block;height:100%;width:5%;background:#9CD3A6;transition:width .3s}.t{font-weight:700;font-size:16px}.s{font-size:13px;opacity:.7}</style></head>
<body><div class="w"><img src="icon-192.png" alt=""><div class="t">한글 나라를 준비하고 있어요</div><div class="s">Preparando 한글 나라…</div><div class="bar"><i id="p"></i></div></div>
<script>
(async()=>{const next=new URLSearchParams(location.search).get('next')||'Main.dc.html';const nm=next.replace(/^\//,'');const safe=/^[A-Za-z]+\.dc\.html$/.test(nm)?'./'+nm:'./Main.dc.html';
 const go=()=>location.replace(safe);const p=document.getElementById('p');
 if(!('serviceWorker' in navigator)){go();return;}
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.hl==='progress')p.style.width=Math.max(5,e.data.done/e.data.total*100)+'%';});
 if(navigator.serviceWorker.controller){go();return;}
 navigator.serviceWorker.addEventListener('controllerchange',()=>{p.style.width='100%';setTimeout(go,150);});
 try{await navigator.serviceWorker.register('sw.js');}catch(e){go();}
})();
</script></body></html>
