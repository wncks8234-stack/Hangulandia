<style>html,body{margin:0;height:100%;overscroll-behavior:none;background:#9BD3A8;font-family:system-ui,sans-serif;color:#4A3A32}
#hl-sp{position:fixed;inset:0;z-index:10;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(120% 70% at 50% 42%,#C4E8CC 0,#A9DAB4 38%,#9BD3A8 62%,#8CCB9B 100%);transition:opacity .5s ease}
#hl-sp.out{opacity:0;pointer-events:none}
.sp-glow{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,240,.55) 0,rgba(255,255,240,0) 68%);animation:spG 3.2s ease-in-out infinite}
@keyframes spG{50%{transform:scale(1.08);opacity:.8}}
.sp-b{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.45);animation:spB linear infinite}
@keyframes spB{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh);opacity:0}}
.sp-tos{position:relative;width:132px;height:auto;animation:spIn .7s cubic-bezier(.3,1.4,.5,1) .1s backwards,spBob 2.4s ease-in-out .8s infinite}
@keyframes spIn{0%{opacity:0;transform:translateY(18px) scale(.82)}100%{opacity:1;transform:none}}
@keyframes spBob{50%{transform:translateY(-8px)}}
.sp-sh{width:96px;height:12px;margin-top:-4px;border-radius:50%;background:rgba(60,110,70,.22);animation:spSh 2.4s ease-in-out .8s infinite}
@keyframes spSh{50%{transform:scaleX(.82);opacity:.7}}
.sp-logo{position:relative;width:min(260px,70vw);height:auto;margin-top:18px;animation:spUp .7s ease-out .45s backwards}
.sp-t{position:relative;margin-top:6px;font-weight:700;font-size:15px;line-height:1.4;animation:spUp .6s ease-out .7s backwards}
.sp-t span{display:block;font-size:12.5px;color:#4E3F98;opacity:.85}
@keyframes spUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.bar{position:relative;width:200px;height:10px;margin-top:22px;border-radius:10px;background:rgba(40,90,55,.16);border:1.5px solid #6E8F74;overflow:hidden;animation:spUp .5s ease-out .8s backwards}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:#FFF4D2;box-shadow:inset 0 -2px 0 rgba(201,160,90,.35);transition:width .35s ease}
@media (prefers-reduced-motion: reduce){.sp-tos,.sp-sh,.sp-glow,.sp-b{animation:none}}</style></head>
