% - 70px);max-height:calc(100% - 70px);display:flex;flex-direction:column;background:#fff;border-top:1.6px solid #4A3A32;border-radius:22px 22px 0 0;overflow:hidden;box-sizing:border-box;color:#4A3A32"><sc-if value="{{ wbInfoOn }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;z-index:30;background:#FBF6EE;display:flex;flex-direction:column;animation:wbUp .5s cubic-bezier(.22,.8,.3,1) both"><div style="flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#D6ECF8;border-bottom:1.6px solid #4A3A32"><div style="flex:1;line-height:1.15"><div style="font-family:'Yoolmi Hand','Fredoka','Noto Sans KR',sans-serif;font-size:19px;font-weight:700">단어장 안내</div><div style="font-size:11.5px;font-weight:700;color:#6B58B8">Guía del vocabulario</div></div><button type="button" onClick="{{ wbInfoClose }}" aria-label="닫기 · Cerrar" style="width:36px;height:36px;border-radius:50%;border:1.4px solid #4A3A32;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A3A32" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 18px;display:flex;flex-direction:column;gap:10px;color:#4A3A32"><div style="background:#fff;border:1.4px solid #E3D6C8;border-radius:16px;padding:12px 14px"><div style="display:inline-flex;align-items:center;gap:6px;background:#D6ECF8;border:1.2px solid #4A3A32;border-radius:999px;padding:1px 10px 1px 8px;font-size:12px;font-weight:800">출처 · Fuente</div><div style="font-family:'Yoolmi Hand','Fredoka','Noto Sans KR',sans-serif;font-size:17px;font-weight:700;margin-top:6px;line-height:1.3">어디서 온 단어인가요?</div><div style="font-size:12px;font-weight:700;color:#6B58B8;line-height:1.3">¿De dónde vienen estas palabras?</div><p style="margin:6px 0 0;font-size:13px;font-weight:700;line-height:1.5">국립국어원 「한국어 교육 어휘 내용 개발(4단계)」(2015)의 초급 어휘 목록(1,835개)을 바탕으로 골랐어요.</p><p style="margin:2px 0 0;font-size:12px;font-weight:700;line-height:1.45;color:#6B58B8">Se basan en la lista de vocabulario básico (1.835 palabras) del Instituto Nacional de la Lengua Coreana, «Desarrollo del vocabulario para la enseñanza del coreano, fase 4» (2015).</p><p style="margin:6px 0 0;font-size:13px;font-weight:700;line-height:1.5">단어장 단어 1,772개 중 1,763개(99%)가 이 목록에 있어요.</p><p style="margin:2px 0 0;font-size:12px;font-weight:700;line-height:1.45;color:#6B58B8">1.763 de las 1.772 palabras (99 %) están en esa lista.</p></div><div style="background:#fff;border:1.4px solid #E3D6C8;border-radius:16px;padding:12px 14px"><div style="display:inline-flex;align-items:center;gap:6px;background:#FFE3E6;border:1.2px solid #4A3A32;border-radius:999px;padding:1px 10px 1px 8px;font-size:12px;font-weight:800">TOPIK</div><div style="font-family:'Yoolmi Hand','Fredoka','Noto Sans KR',sans-serif;font-size:17px;font-weight:700;margin-top:6px;line-height:1.3">TOPIK과는 어떤 관계인가요?</div><div style="font-size:12px;font-weight:700;color:#6B58B8;line-height:1.3">¿Qué relación tiene con el TOPIK?</div><div style="margin-top:8px;display:flex;align-items:center;gap:10px;background:#FFF8EC;border:1.2px solid #E3D6C8;border-radius:12px;padding:8px 12px"><span style="font-family:'Yoolmi Hand','Fredoka','Noto Sans KR',sans-serif;font-size:22px;font-weight:700;white-space:nowrap">TOPIK I</span><span style="font-size:12.5px;font-weight:800;line-height:1.35">1급 · 2급<br><span style="color:#6B58B8">Nivel 1 y 2</span></span></div><p style="margin:6px 0 0;font-size:13px;font-weight:700;line-height:1.5">초급 어휘 목록은 초급 교재와 한국어능력시험(TOPIK)에 실제로 쓰인 단어를 바탕으로 골랐어요. 그래서 일상적이고 친숙한 주제의 기초 어휘를 익히고 TOPIK I 어휘를 준비하는 데 도움이 돼요.</p><p style="margin:2px 0 0;font-size:12px;font-weight:700;line-height:1.45;color:#6B58B8">La lista básica se eligió a partir de palabras que se usan de verdad en libros de nivel inicial y en el examen TOPIK. Por eso te ayuda a aprender vocabulario básico de temas cotidianos y a preparar el vocabulario del TOPIK I.</p></div><div style="background:#fff;border:1.4px solid #E3D6C8;border-radius:16px;padding:12px 14px"><div style="display:inline-flex;align-items:center;gap:6px;background:#FFF3C9;border:1.2px solid #4A3A32;border-radius:999px;padding:1px 10px 1px 8px;font-size:12px;font-weight:800"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-2px"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" fill="#F7C948" stroke="#8A766B" stroke-width="1.3" stroke-linejoin="round"/></svg> 꼭 외울 단어 · Imprescindibles</div><div style="font-family:'Yoolmi Hand','Fredoka','Noto Sans KR',sans-serif;font-size:17px;font-weight:700;margin-top:6px;line-height:1.3">어떤 단어를 꼭 외워야 하나요?</div><div style="font-size:12px;font-weight:700;color:#6B58B8;line-height:1.3">¿Qué palabras debo memorizar sí o sí?</div><p style="margin:6px 0 0;font-size:13px;font-weight:700;line-height:1.5">토순이 훈련(퀴즈)과 맵 그림책에 나오는 단어예요. 수업과 훈련에서 바로 쓰이니까 먼저 외워요. 카드에 별이 붙어 있어요.</p><p style="margin:2px 0 0;font-size:12px;font-weight:700;line-height:1.45;color:#6B58B8">Son las palabras que aparecen en el entrenamiento (quiz de Tosuni) y en los libros del mapa. Se usan enseguida, así que apréndelas primero. Llevan una estrella en la tarjeta.</p><div style="margin-top:10px"><div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:10.5px;font-weight:800;color:#7A6A60;padding-bottom:4px"><span>레벨 · Nivel</span><span style="text-align:right">전체 · Total</span><span style="min-width:74px;text-align:right">꼭 외울 단어</span></div><div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed #E3D6C8"><span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800"><span style="width:12px;height:14px;border-radius:2px;background:#F6CF6E;border:1.2px solid #4A3A32"></span>씨앗 <span style="font-size:11px;color:#6B58B8">Semilla</span></span><span style="font-size:12px;font-weight:700;color:#7A6A60;text-align:right">100개</span><span style="min-width:74px;text-align:right;font-size:13px;font-weight:800">100개<br><span style="font-size:10.5px;color:#6B58B8">todas</span></span></div><div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed #E3D6C8"><span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800"><span style="width:12px;height:14px;border-radius:2px;background:#8FCB9B;border:1.2px solid #4A3A32"></span>새싹 <span style="font-size:11px;color:#6B58B8">Brote</span></span><span style="font-size:12px;font-weight:700;color:#7A6A60;text-align:right">473개</span><span style="min-width:74px;text-align:right;font-size:13px;font-weight:800">260개<br><span style="font-size:10.5px;color:#6B58B8">imprescindibles</span></span></div><div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed #E3D6C8"><span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800"><span style="width:12px;height:14px;border-radius:2px;background:#EE9DB3;border:1.2px solid #4A3A32"></span>꽃잎 <span style="font-size:11px;color:#6B58B8">Pétalo</span></span><span style="font-size:12px;font-weight:700;color:#7A6A60;text-align:right">1,201개</span><span style="min-width:74px;text-align:right;font-size:13px;font-weight:800">649개<br><span style="font-size:10.5px;color:#6B58B8">imprescindibles</span></span></div></div><p style="margin:6px 0 0;font-size:13px;font-weight:700;line-height:1.5">씨앗 단어는 한글 읽기 연습 단어라 모두 외워요. 새싹·꽃잎을 합치면 꼭 외울 단어는 907개예요(겹치는 단어 제외).</p><p style="margin:2px 0 0;font-size:12px;font-weight:700;line-height:1.45;color:#6B58B8">Las de Semilla son para practicar la lectura del hangul: apréndelas todas. Entre Brote y Pétalo hay 907 palabras imprescindibles (sin repetir).</p></div></div><
